name: tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't fail the whole matrix if one combination has issues - report them
      # individually so we still see results from the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['latest']

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        # The mariadb image ships a healthcheck.sh that works without
        # external clients. The default MySQL/MariaDB images only
        # listen on a unix socket until initialised, so we wait for
        # "innodb_initialized" before considering the service healthy.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, bcmath, pdo_mysql
          coverage: none
          tools: composer

      - name: Verify required extensions are loaded
        run: |
          set -e
          for ext in mysqli mbstring bcmath pdo_mysql; do
            if ! php -m | grep -qi "^$ext"; then
              echo "::error::Required PHP extension '$ext' is not loaded"
              exit 1
            fi
          done

      - name: Lint first-party PHP files
        # Skip third-party libraries under Classes/ - they pin PHP 5/7 syntax
        # (e.g. PHPExcel uses curly-brace array offsets which PHP 8 removed).
        # We don't own that code and don't need to keep it lint-clean.
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -not -path './Classes/*' -print0 | xargs -0 -n1 php -l 2>&1 | tee /tmp/lint.log | grep -v "No syntax errors" || true
          if grep -q "Errors parsing" /tmp/lint.log; then
            echo "::error::PHP lint errors found"
            exit 1
          fi
          echo "All first-party PHP files parse cleanly."

      # Use PHP's mysqli instead of the mysql CLI client - the mysql
      # binary isn't installed by default on ubuntu-latest, and PHP
      # is already set up and knows about mysqli.
      - name: Wait for MariaDB to be reachable
        run: |
          for i in $(seq 1 60); do
            if php -r '
              $dbh = @mysqli_connect("127.0.0.1", "root", "rootpw", "", 3306);
              if(!$dbh) { exit(1); }
              $r = @mysqli_query($dbh, "SELECT 1");
              exit($r ? 0 : 1);
            ' 2>/dev/null; then
              echo "MariaDB is up"
              exit 0
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done
          echo "::error::MariaDB did not become reachable in time"
          exit 1

      - name: Seed /etc/vvzdbpw with the DB password
        run: |
          # VVZ reads the DB password from /etc/vvzdbpw. We point it at the
          # root user of the MariaDB service container.
          echo -n "rootpw" | sudo tee /etc/vvzdbpw > /dev/null
          sudo chmod 600 /etc/vvzdbpw

      - name: Create startpage database (best-effort)
        run: |
          # Some VVZ bootstrap queries need the customer DB to exist
          # before selftest() runs. We create it via PHP here so we
          # don't depend on the mysql CLI being installed.
          php -r '
            $dbh = mysqli_connect("127.0.0.1", "root", "rootpw", "", 3306);
            if(!$dbh) { fwrite(STDERR, "Cannot connect to MariaDB\n"); exit(1); }
            mysqli_query($dbh, "CREATE DATABASE IF NOT EXISTS startpage");
            echo "startpage DB is ready\n";
          '

      - name: Seed default data from initialdatensatz.php
        run: |
          php -d xdebug.mode=off -r '
            $GLOBALS["no_selftest"] = 1;
            $GLOBALS["no_selftest_force"] = 1;
            require "functions.php";
            require "tests/setup_db.php";

            $dbname = $GLOBALS["dbname"];
            rquery("UPDATE vvz_global.kundendaten SET plan_id = 1 WHERE dbname = " . esc($dbname));
            // initialdatensatz uses building "GER" with id 122. Remove the
            // default building with the same abbreviation first so the
            // referenced room/event rows can be inserted.
            rquery("DELETE FROM `raum` WHERE `gebaeude_id` IN (SELECT `id` FROM `gebaeude` WHERE `abkuerzung` = 'GER' AND `id` <> 122)");
            rquery("DELETE FROM `gebaeude` WHERE `abkuerzung` = 'GER' AND `id` <> 122");
            $GLOBALS["logged_in_user_id"] = 1;
            $GLOBALS["user_role_id"] = 1;

            include "initialdatensatz.php";
            echo "Seeded initialdatensatz for $dbname\n";
          '

      - name: Run testsuite
        run: |
          set -e
          echo "=========================================="
          echo "  PHP $(php -r 'echo PHP_VERSION;')"
          echo "=========================================="
          php testsuite.php

      - name: Run pure (no-DB) tests
        run: |
          echo "=========================================="
          echo "  Pure tests (no database)"
          echo "=========================================="
          php tests/run_pure_tests.php

      - name: Run subpage smoke tests
        run: |
          echo "=========================================="
          echo "  Subpage smoke tests"
          echo "=========================================="
          php tests/run_page_tests.php

      - name: Run request dispatcher tests
        run: |
          echo "=========================================="
          echo "  Request dispatcher tests"
          echo "=========================================="
          php tests/run_request_tests.php

  # Dedicated coverage job. It runs the full DB suite and the pure suite
  # with Xdebug coverage enabled, merges the raw data and posts a coverage
  # table to the workflow run summary (GITHUB_STEP_SUMMARY). The HTML
  # report is uploaded as an artifact.
  coverage:
    name: Coverage (latest PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      XDEBUG_MODE: coverage
      VVZ_COVERAGE_DIR: ${{ github.workspace }}/vvz-coverage-data

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup latest PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: 'latest'
          extensions: mysqli, mbstring, bcmath, pdo_mysql
          coverage: xdebug

      - name: Wait for MariaDB to be reachable
        run: |
          for i in $(seq 1 60); do
            if php -r '
              $dbh = @mysqli_connect("127.0.0.1", "root", "rootpw", "", 3306);
              if(!$dbh) { exit(1); }
              $r = @mysqli_query($dbh, "SELECT 1");
              exit($r ? 0 : 1);
            ' 2>/dev/null; then
              echo "MariaDB is up"
              exit 0
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done
          echo "::error::MariaDB did not become reachable in time"
          exit 1

      - name: Seed /etc/vvzdbpw with the DB password
        run: |
          echo -n "rootpw" | sudo tee /etc/vvzdbpw > /dev/null
          sudo chmod 600 /etc/vvzdbpw

      - name: Create startpage database
        run: |
          php -r '
            $dbh = mysqli_connect("127.0.0.1", "root", "rootpw", "", 3306);
            if(!$dbh) { fwrite(STDERR, "Cannot connect to MariaDB\n"); exit(1); }
            mysqli_query($dbh, "CREATE DATABASE IF NOT EXISTS startpage");
            echo "startpage DB is ready\n";
          '

      - name: Seed default data from initialdatensatz.php
        run: |
          php -d xdebug.mode=off -r '
            $GLOBALS["no_selftest"] = 1;
            $GLOBALS["no_selftest_force"] = 1;
            require "functions.php";
            require "tests/setup_db.php";

            $dbname = $GLOBALS["dbname"];
            rquery("UPDATE vvz_global.kundendaten SET plan_id = 1 WHERE dbname = " . esc($dbname));
            // initialdatensatz uses building "GER" with id 122. Remove the
            // default building with the same abbreviation first so the
            // referenced room/event rows can be inserted.
            rquery("DELETE FROM `raum` WHERE `gebaeude_id` IN (SELECT `id` FROM `gebaeude` WHERE `abkuerzung` = 'GER' AND `id` <> 122)");
            rquery("DELETE FROM `gebaeude` WHERE `abkuerzung` = 'GER' AND `id` <> 122");
            $GLOBALS["logged_in_user_id"] = 1;
            $GLOBALS["user_role_id"] = 1;

            include "initialdatensatz.php";
            echo "Seeded initialdatensatz for $dbname\n";
          '

      - name: Run DB tests with coverage
        run: |
          set +e
          mkdir -p "$VVZ_COVERAGE_DIR"
          php -d auto_prepend_file=tests/coverage/bootstrap.php testsuite.php
          status=$?
          echo "$status" > "$RUNNER_TEMP/testsuite.exit"
          echo "testsuite.php exit code: $status"
          exit 0

      - name: Run pure tests with coverage
        run: |
          set +e
          php -d auto_prepend_file=tests/coverage/bootstrap.php tests/run_pure_tests.php
          status=$?
          echo "$status" > "$RUNNER_TEMP/pure.exit"
          echo "run_pure_tests.php exit code: $status"
          exit 0

      - name: Run subpage tests with coverage
        run: |
          set +e
          php tests/run_page_tests.php
          status=$?
          echo "$status" > "$RUNNER_TEMP/pages.exit"
          echo "run_page_tests.php exit code: $status"
          exit 0

      - name: Run request dispatcher tests with coverage
        run: |
          set +e
          php tests/run_request_tests.php
          status=$?
          echo "$status" > "$RUNNER_TEMP/requests.exit"
          echo "run_request_tests.php exit code: $status"
          exit 0

      - name: Generate coverage report
        if: always()
        run: |
          php tests/coverage/report.php \
            --dir="$VVZ_COVERAGE_DIR" \
            --summary="$RUNNER_TEMP/coverage-summary.md" \
            --html="$RUNNER_TEMP/coverage-report/index.html" \
            --json="$RUNNER_TEMP/coverage-report/coverage.json"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: warn

      - name: Fail when a test suite failed
        if: always()
        run: |
          set -e
          testsuite_status=$(cat "$RUNNER_TEMP/testsuite.exit" 2>/dev/null || echo 1)
          pure_status=$(cat "$RUNNER_TEMP/pure.exit" 2>/dev/null || echo 1)
          pages_status=$(cat "$RUNNER_TEMP/pages.exit" 2>/dev/null || echo 1)
          requests_status=$(cat "$RUNNER_TEMP/requests.exit" 2>/dev/null || echo 1)
          echo "testsuite.php: $testsuite_status"
          echo "run_pure_tests.php: $pure_status"
          echo "run_page_tests.php: $pages_status"
          echo "run_request_tests.php: $requests_status"
          if [ "$testsuite_status" != "0" ] || [ "$pure_status" != "0" ] || [ "$pages_status" != "0" ] || [ "$requests_status" != "0" ]; then
            echo "::error::At least one test suite failed"
            exit 1
          fi

  # Separate job that runs once per workflow run (after all matrix
  # combinations succeed) and pushes a tag like `ci-run-1234567890`
  # pointing at the tested commit. The runner ID is unique across all
  # workflow runs, so tags never collide even on rapid pushes.
  #
  # Skipped on pull_request because external forks don't have write
  # access to the base repo's tags.
  tag-success:
    name: Tag successful run
    needs: [test, coverage]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          # Need full history so `git push origin <tag>` works.
          fetch-depth: 0

      - name: Push tag with runner ID
        run: |
          TAG="ci-run-${{ github.run_id }}"
          # Don't re-tag if the workflow was re-run with the same ID
          # (can happen on manual re-runs).
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "CI run ${{ github.run_id }} passed on ${{ github.sha }}"
          git push origin "$TAG"
          echo "Pushed tag: $TAG"
