name: tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't fail the whole matrix if one combination has issues - report them
      # individually so we still see results from the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        # The mariadb image ships a healthcheck.sh that works without
        # external clients. The default MySQL/MariaDB images only
        # listen on a unix socket until initialised, so we wait for
        # "innodb_initialized" before considering the service healthy.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, bcmath, pdo_mysql
          coverage: none
          tools: composer

      - name: Verify required extensions are loaded
        run: |
          set -e
          for ext in mysqli mbstring bcmath pdo_mysql; do
            if ! php -m | grep -qi "^$ext"; then
              echo "::error::Required PHP extension '$ext' is not loaded"
              exit 1
            fi
          done

      # Use PHP's mysqli instead of the mysql CLI client - the mysql
      # binary isn't installed by default on ubuntu-latest, and PHP
      # is already set up and knows about mysqli.
      - name: Wait for MariaDB to be reachable
        run: |
          for i in $(seq 1 60); do
            if php -r '
              $dbh = @mysqli_connect("127.0.0.1", "root", "rootpw", "", 3306);
              if(!$dbh) { exit(1); }
              $r = @mysqli_query($dbh, "SELECT 1");
              exit($r ? 0 : 1);
            ' 2>/dev/null; then
              echo "MariaDB is up"
              exit 0
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done
          echo "::error::MariaDB did not become reachable in time"
          exit 1

      - name: Seed /etc/vvzdbpw with the DB password
        run: |
          # VVZ reads the DB password from /etc/vvzdbpw. We point it at the
          # root user of the MariaDB service container.
          echo -n "rootpw" | sudo tee /etc/vvzdbpw > /dev/null
          sudo chmod 600 /etc/vvzdbpw

      - name: Create startpage database (best-effort)
        run: |
          # Some VVZ bootstrap queries need the customer DB to exist
          # before selftest() runs. We create it via PHP here so we
          # don't depend on the mysql CLI being installed.
          php -r '
            $dbh = mysqli_connect("127.0.0.1", "root", "rootpw", "", 3306);
            if(!$dbh) { fwrite(STDERR, "Cannot connect to MariaDB\n"); exit(1); }
            mysqli_query($dbh, "CREATE DATABASE IF NOT EXISTS startpage");
            echo "startpage DB is ready\n";
          '

      - name: Run testsuite
        run: |
          set -e
          echo "=========================================="
          echo "  PHP $(php -r 'echo PHP_VERSION;')"
          echo "=========================================="
          php testsuite.php

      - name: Run pure (no-DB) tests
        run: |
          echo "=========================================="
          echo "  Pure tests (no database)"
          echo "=========================================="
          php tests/run_pure_tests.php

  lint:
    name: Lint syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint every PHP file
        run: |
          set -e
          # Skip third-party libraries under Classes/ - they pin PHP 5/7 syntax
          # (e.g. PHPExcel uses curly-brace array offsets which PHP 8 removed).
          # We don't own that code and don't need to keep it lint-clean.
          find . -name '*.php' -not -path './.git/*' -not -path './Classes/*' -print0 | xargs -0 -n1 php -l
          echo "All first-party PHP files parse cleanly."
